<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pub Crawl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  {% if session.player_id %}
  <nav class="top-nav">
    <span class="top-nav-brand">🍺 Pub Crawl</span>
    <span class="top-nav-player">{{ session.player_name }}</span>
  </nav>
  {% endif %}

  <div class="container mt-3 pb-4">
    {% block content %}{% endblock %}
  </div>

  {% if session.player_id %}
  <nav class="bottom-nav">
    <a href="/score" class="bottom-nav-link {% if request.path == '/score' %}active{% endif %}">
      <span class="nav-icon">🍺</span>Score
    </a>
    <a href="/leaderboard" class="bottom-nav-link {% if request.path == '/leaderboard' %}active{% endif %}">
      <span class="nav-icon">🏆</span>Board
    </a>
    <a href="/map" class="bottom-nav-link {% if request.path == '/map' %}active{% endif %}">
      <span class="nav-icon">📍</span>Map
    </a>
    <a href="/wheel" class="bottom-nav-link {% if request.path == '/wheel' %}active{% endif %}">
      <span class="nav-icon">🎡</span>Wheel
    </a>
  </nav>
  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
