{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6">

    <div class="join-hero">
      <span class="beer-icon">🍺</span>
      <h1>Pub Crawl</h1>
      <p class="text-muted" style="font-size:0.9rem;">Enter your details to join the crawl</p>
    </div>

    {% if error %}
    <div class="alert alert-danger mb-3">{{ error }}</div>
    {% endif %}

    <div class="card">
      <div class="card-body p-4">
        <form method="POST" action="/join">
          <div class="mb-4">
            <label class="form-label">Your Name</label>
            <input type="text" name="name" class="form-control form-control-lg"
                   placeholder="e.g. Dave" required autofocus autocomplete="off">
          </div>
          <button type="submit" class="btn btn-warning btn-lg w-100">
            Join the Crawl 🍻
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-4 small">
      <a href="/admin" class="text-muted">Organiser? Admin panel →</a>
    </p>

  </div>
</div>
{% endblock %}
